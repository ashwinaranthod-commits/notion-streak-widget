<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30-Day Grind</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #1a1a1a;
    --card:         #1e1e1e;
    --surface:      #252525;
    --border:       #383838;
    --text:         #e8e8e6;
    --muted:        #6a6a6a;
    --orange:       #e06c42;
    --orange-bg:    rgba(224, 108, 66, 0.12);
    --orange-glow:  rgba(224, 108, 66, 0.35);
    --green:        #4caf6e;
    --green-bg:     rgba(76, 175, 110, 0.10);
    --green-glow:   rgba(76, 175, 110, 0.35);
    --gold:         #d4a017;
    --gold-bg:      rgba(212, 160, 23, 0.10);
    --gold-glow:    rgba(212, 160, 23, 0.35);
    --missed-color: #7a5a4a;
  }

  body {
    font-family: 'Space Mono', monospace;
    background: #191919;
    color: var(--text);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 0;
  }

  .widget {
    width: 100%;
    max-width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
  }

  /* ── HEADER ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 16px 13px;
    border-bottom: 1px solid var(--border);
  }

  .header-left .challenge-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .header-left .challenge-title {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--text);
  }
  .header-left .challenge-title .hi { color: var(--orange); }

  .streak-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 95px;
  }
  .streak-box .fire-big { font-size: 22px; line-height: 1; }
  .streak-box-right {}
  .streak-box .streak-num {
    font-size: 24px;
    font-weight: 900;
    line-height: 1;
    color: var(--orange);
    letter-spacing: -0.02em;
  }
  .streak-box .streak-label {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 1px;
  }

  /* ── STATS ROW ── */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border-bottom: 1px solid var(--border);
  }
  .stat {
    padding: 11px 8px;
    text-align: center;
    border-right: 1px solid var(--border);
  }
  .stat:last-child { border-right: none; }
  .stat-val {
    font-size: 19px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-val.white  { color: #ffffff; }
  .stat-val.gold   { color: var(--gold); }
  .stat-val.dim    { color: var(--muted); }
  .stat-val.rate-green  { color: var(--green); }
  .stat-val.rate-yellow { color: #e6c84a; }
  .stat-val.rate-red    { color: #e05555; }
  .stat-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── MONTH NAV ── */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px 4px;
  }
  .nav-btn {
    width: 24px; height: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    font-size: 11px;
    transition: all 0.15s;
    user-select: none;
  }
  .nav-btn:hover { background: var(--border); color: var(--text); }
  .nav-btn:active { transform: scale(0.92); }
  .nav-btn:disabled { opacity: 0.2; cursor: default; }

  .month-hint {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .month-hint .sep { margin: 0 8px; opacity: 0.4; }

  /* ── WEEKDAY LABELS ── */
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 3px 10px 1px;
    gap: 4px;
  }
  .wd {
    text-align: center;
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 2px 0;
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 3px 10px 10px;
    gap: 4px;
  }

  .day {
    aspect-ratio: 1;
    border-radius: 11px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    position: relative;
    user-select: none;
    background: var(--surface);
    border: 2px solid var(--border);
  }

  .day-num {
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  .day-icon {
    font-size: 11px;
    line-height: 1;
  }

  /* Empty placeholder */
  .day.empty {
    pointer-events: none;
    background: #191919;
    border-color: transparent;
  }

  /* Future — very dim */
  .day.future {
    background: #1e1e1e;
    border-color: #2a2a2a;
    cursor: default;
    opacity: 0.4;
  }
  .day.future .day-num { color: #444; }

  /* Missed past day */
  .day.missed {
    background: #222020;
    border-color: #3a3232;
  }
  .day.missed .day-num  { color: var(--missed-color); }
  .day.missed .day-icon { color: var(--missed-color); font-size: 9px; }
  .day.missed:hover { border-color: #554444; }

  /* Done — GREEN tick (broken streak / past workout) */
  .day.done-green {
    background: var(--green-bg);
    border-color: var(--green);
    box-shadow: 0 0 10px var(--green-glow), inset 0 0 8px rgba(76,175,110,0.07);
  }
  .day.done-green .day-num  { color: var(--green); }
  .day.done-green .day-icon { color: var(--green); }
  .day.done-green:hover { transform: scale(1.05); box-shadow: 0 0 16px var(--green-glow); }

  /* Done — ORANGE fire (current active streak) */
  .day.done-orange {
    background: var(--orange-bg);
    border-color: var(--orange);
    box-shadow: 0 0 10px var(--orange-glow), inset 0 0 8px rgba(224,108,66,0.07);
  }
  .day.done-orange .day-num { color: var(--orange); }
  .day.done-orange:hover { transform: scale(1.05); box-shadow: 0 0 16px var(--orange-glow); }

  /* Today — gold border override (applies on top of done-green / done-orange / undone) */
  .day.today-ring {
    border-color: var(--gold) !important;
    box-shadow: 0 0 10px var(--gold-glow) !important;
  }
  .day.today-ring .day-num { color: var(--gold) !important; }
  .day.today-ring:hover { box-shadow: 0 0 18px var(--gold-glow) !important; }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    padding: 7px 12px 5px;
  }
  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--orange));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* ── FOOTER ── */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px 14px;
  }
  .challenge-counter {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .challenge-counter span {
    color: var(--text);
  }

  .reset-btn {
    font-size: 9px;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .reset-btn:hover { color: var(--orange); border-color: var(--orange); }

  /* ── Confirm bar ── */
  .confirm-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 9px 16px;
    background: rgba(224,108,66,0.07);
    border-top: 1px solid rgba(224,108,66,0.2);
    gap: 10px;
  }
  .confirm-bar.visible { display: flex; }
  .confirm-text { font-size: 10px; color: var(--orange); flex: 1; letter-spacing: 0.03em; }
  .confirm-actions { display: flex; gap: 6px; }
  .confirm-yes, .confirm-no {
    font-size: 9px;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid;
  }
  .confirm-yes { background: var(--orange); border-color: var(--orange); color: #fff; }
  .confirm-yes:hover { background: #e87e58; }
  .confirm-no  { background: none; border-color: var(--border); color: var(--muted); }
  .confirm-no:hover { border-color: var(--muted); color: var(--text); }

  /* ── Transitions ── */
  .grid, .weekdays { transition: opacity 0.18s; }
  .grid.fade, .weekdays.fade { opacity: 0; }

  /* ── Streak pulse on active run ── */
  @keyframes streak-pulse {
    0%, 100% { box-shadow: 0 0 10px var(--orange-glow), inset 0 0 8px rgba(224,108,66,0.07); }
    50%       { box-shadow: 0 0 20px var(--orange-glow), inset 0 0 12px rgba(224,108,66,0.12); }
  }
  .day.done-orange.pulsing {
    animation: streak-pulse 2s ease-in-out infinite;
  }
</style>
</head>
<body>
<div class="widget">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="challenge-label">Challenge</div>
      <div class="challenge-title">THE 360</div>
    </div>
    <div class="streak-box">
      <span class="fire-big">🔥</span>
      <div class="streak-box-right">
        <div class="streak-num" id="streakNum">0</div>
        <div class="streak-label">Streak</div>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <div class="stat-val white" id="statDone">0</div>
      <div class="stat-label">Done</div>
    </div>
    <div class="stat">
      <div class="stat-val white" id="statMissed">0</div>
      <div class="stat-label">Missed</div>
    </div>
    <div class="stat">
      <div class="stat-val dim" id="statRate">0%</div>
      <div class="stat-label">Rate</div>
    </div>
  </div>

  <!-- MONTH NAV -->
  <div class="month-nav">
    <button class="nav-btn" id="prevBtn">&#8592;</button>
    <div class="month-hint">
      <span id="monthName"></span><span class="sep">·</span>TAP A DAY TO LOG
    </div>
    <button class="nav-btn" id="nextBtn">&#8594;</button>
  </div>

  <!-- WEEKDAYS -->
  <div class="weekdays" id="weekdays">
    <div class="wd">Sun</div><div class="wd">Mon</div><div class="wd">Tue</div>
    <div class="wd">Wed</div><div class="wd">Thu</div><div class="wd">Fri</div>
    <div class="wd">Sat</div>
  </div>

  <!-- GRID -->
  <div class="grid" id="grid"></div>

  <!-- PROGRESS -->
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <!-- CONFIRM BAR -->
  <div class="confirm-bar" id="confirmBar">
    <span class="confirm-text" id="confirmText"></span>
    <div class="confirm-actions">
      <button class="confirm-no"  id="confirmNo">Cancel</button>
      <button class="confirm-yes" id="confirmYes">Clear</button>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="challenge-counter" id="challengeCounter">365/<span id="totalDone">00</span></div>
    <button class="reset-btn" id="resetBtn">Reset</button>
  </div>

</div>

<script>
  const MONTHS_SHORT = ['JAN','FEB','MAR','APR','MAY','JUN',
                        'JUL','AUG','SEP','OCT','NOV','DEC'];

  const today = new Date();
  let viewYear  = 2026;
  let viewMonth = 5; // June 2026

  const workouts = {};

  function getSet(y, m) {
    if (!workouts[y]) workouts[y] = {};
    if (!workouts[y][m]) workouts[y][m] = new Set();
    return workouts[y][m];
  }

  function save() {
    const flat = {};
    for (const y in workouts)
      for (const m in workouts[y])
        flat[`${y}-${m}`] = [...workouts[y][m]];
    try { localStorage.setItem('workout_grind_v3', JSON.stringify(flat)); } catch(e){}
  }

  function load() {
    try {
      const raw = localStorage.getItem('workout_grind_v3');
      if (!raw) return;
      const flat = JSON.parse(raw);
      for (const k in flat) {
        const [y, m] = k.split('-').map(Number);
        if (!workouts[y]) workouts[y] = {};
        workouts[y][m] = new Set(flat[k]);
      }
    } catch(e){}
  }

  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function firstDow(y, m)    { return new Date(y, m, 1).getDay(); }

  /* Current streak = consecutive done days ending on today (or yesterday) */
  function calcCurrentStreak() {
    let streak = 0;
    const d = new Date(today);
    const todaySet = getSet(d.getFullYear(), d.getMonth());
    if (!todaySet.has(d.getDate())) d.setDate(d.getDate() - 1);
    while (true) {
      const s = getSet(d.getFullYear(), d.getMonth());
      if (!s.has(d.getDate())) break;
      streak++;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }

  /*
   * For each done day in the viewed month, decide its colour:
   * - If it belongs to the unbroken run that extends to today (or yesterday) → orange
   * - Otherwise → green
   *
   * Algorithm: find the current streak days in this month, mark them orange.
   * All other done days are green.
   */
  function getStreakDaysInMonth(y, m) {
    // Build the set of days that are part of the current streak
    const streakDays = new Set();
    const d = new Date(today);
    const todaySet = getSet(d.getFullYear(), d.getMonth());
    if (!todaySet.has(d.getDate())) d.setDate(d.getDate() - 1);
    while (true) {
      const s = getSet(d.getFullYear(), d.getMonth());
      if (!s.has(d.getDate())) break;
      if (d.getFullYear() === y && d.getMonth() === m) {
        streakDays.add(d.getDate());
      }
      d.setDate(d.getDate() - 1);
      // Stop if we've gone back further than the viewed month
      if (d.getFullYear() * 12 + d.getMonth() < y * 12 + m) break;
    }
    return streakDays;
  }

  function render() {
    const grid = document.getElementById('grid');
    const set  = getSet(viewYear, viewMonth);
    const total = daysInMonth(viewYear, viewMonth);
    const fdow  = firstDow(viewYear, viewMonth);

    const isCurrentMonth = (viewYear === today.getFullYear() && viewMonth === today.getMonth());
    const isFutureMonth  = (viewYear * 12 + viewMonth) > (today.getFullYear() * 12 + today.getMonth());

    document.getElementById('monthName').textContent = MONTHS_SHORT[viewMonth] + ' ' + viewYear;

    const todayMonthIdx = today.getFullYear() * 12 + today.getMonth();
    const viewIdx       = viewYear * 12 + viewMonth;
    document.getElementById('prevBtn').disabled = (viewIdx <= 2026 * 12 + 5);
    document.getElementById('nextBtn').disabled = (viewIdx >= 2027 * 12 + 5);

    const streakDays = getStreakDaysInMonth(viewYear, viewMonth);

    grid.innerHTML = '';

    // Empty offset cells
    for (let i = 0; i < fdow; i++) {
      const e = document.createElement('div');
      e.className = 'day empty';
      grid.appendChild(e);
    }

    for (let d = 1; d <= total; d++) {
      const cell = document.createElement('div');
      const isFuture = isCurrentMonth ? d > today.getDate() : isFutureMonth;
      const isDone   = set.has(d);
      const isToday  = isCurrentMonth && d === today.getDate();
      const isPast   = !isFuture;

      // Determine class
      let cls = 'day ';
      if (isFuture) {
        cls += 'future';
      } else if (isDone) {
        cls += streakDays.has(d) ? 'done-orange' : 'done-green';
      } else {
        cls += isPast ? 'missed' : 'future';
      }
      cell.className = cls;
      if (isToday) cell.classList.add('today-ring');
      // Pulse the latest orange day (last in streak run in this month)
      if (isDone && streakDays.has(d) && isCurrentMonth && d === today.getDate()) {
        cell.classList.add('pulsing');
      }
      cell.dataset.day = d;

      const numEl  = document.createElement('span');
      numEl.className = 'day-num';
      numEl.textContent = String(d).padStart(2, '0');

      const iconEl = document.createElement('span');
      iconEl.className = 'day-icon';
      if (isDone) {
        iconEl.textContent = streakDays.has(d) ? '🔥' : '✓';
      } else if (isPast && !isFutureMonth) {
        iconEl.textContent = '✕';
      }

      cell.appendChild(numEl);
      cell.appendChild(iconEl);

      if (!isFuture) {
        cell.addEventListener('click', () => {
          if (set.has(d)) set.delete(d); else set.add(d);
          save(); render();
        });
      }

      grid.appendChild(cell);
    }

    updateStats(set, total, isCurrentMonth, isFutureMonth);
  }

  // Challenge window: Jun 1 2026 → Jun 30 2027 (365 days)
  const CHALLENGE_START = new Date(2026, 5, 1);  // Jun 1 2026
  const CHALLENGE_END   = new Date(2027, 5, 30); // Jun 30 2027

  function calcGlobalStats() {
    // Count total done days across ALL months in the challenge
    let totalDone   = 0;
    let totalPast   = 0; // elapsed days up to today within challenge window
    let totalMissed = 0;

    const cursor = new Date(CHALLENGE_START);
    const cap    = today < CHALLENGE_END ? today : CHALLENGE_END;

    while (cursor <= cap) {
      const y = cursor.getFullYear();
      const m = cursor.getMonth();
      const d = cursor.getDate();
      const s = getSet(y, m);
      if (s.has(d)) totalDone++; else totalMissed++;
      totalPast++;
      cursor.setDate(cursor.getDate() + 1);
    }

    const rate = totalPast > 0 ? Math.round((totalDone / totalPast) * 100) : 0;
    return { totalDone, totalMissed, rate };
  }

  function updateStats(set, total, isCurrentMonth, isFutureMonth) {
    const streak = calcCurrentStreak();
    const { totalDone, totalMissed, rate } = calcGlobalStats();

    document.getElementById('streakNum').textContent  = streak;
    document.getElementById('statDone').textContent   = totalDone;
    document.getElementById('statMissed').textContent = totalMissed;
    document.getElementById('statRate').textContent   = rate + '%';
    document.getElementById('totalDone').textContent  = String(totalDone).padStart(2, '0');

    // Done & missed → always white
    document.getElementById('statDone').className   = 'stat-val white';
    document.getElementById('statMissed').className = 'stat-val white';

    // Rate colour by threshold
    const rEl = document.getElementById('statRate');
    if (rate >= 80)      rEl.className = 'stat-val rate-green';
    else if (rate >= 60) rEl.className = 'stat-val rate-yellow';
    else                 rEl.className = 'stat-val rate-red';

    // Progress bar based on global rate
    document.getElementById('progressFill').style.width = rate + '%';
  }

  function changeMonth(delta) {
    const grid = document.getElementById('grid');
    const wds  = document.getElementById('weekdays');
    grid.classList.add('fade'); wds.classList.add('fade');
    setTimeout(() => {
      viewMonth += delta;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
      render();
      grid.classList.remove('fade'); wds.classList.remove('fade');
    }, 180);
  }

  document.getElementById('prevBtn').addEventListener('click', () => changeMonth(-1));
  document.getElementById('nextBtn').addEventListener('click', () => changeMonth(1));

  const confirmBar  = document.getElementById('confirmBar');
  const confirmText = document.getElementById('confirmText');

  document.getElementById('resetBtn').addEventListener('click', () => {
    confirmText.textContent = 'Clear all workouts for ' + MONTHS_SHORT[viewMonth] + ' ' + viewYear + '?';
    confirmBar.classList.add('visible');
  });
  document.getElementById('confirmYes').addEventListener('click', () => {
    confirmBar.classList.remove('visible');
    getSet(viewYear, viewMonth).clear();
    save(); render();
  });
  document.getElementById('confirmNo').addEventListener('click', () => {
    confirmBar.classList.remove('visible');
  });

  load();
  render();
</script>
</body>
</html>
