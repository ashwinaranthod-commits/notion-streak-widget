<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30-Day Workout Streak</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a1a;
    --surface: #16161a;
    --card: #1c1c21;
    --border: #2a2a32;
    --fire: #ff5c00;
    --fire-glow: rgba(255, 92, 0, 0.25);
    --gold: #f5c842;
    --green: #39d98a;
    --muted: #5a5a6e;
    --text: #e8e8f0;
    --text-dim: #8888a0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .widget {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: none;
  }

  /* ── Header ── */
  .header {
    padding: 24px 24px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .title-block {}
  .label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 0.04em;
    line-height: 1;
    color: var(--text);
  }
  .title span { color: var(--fire); }

  .streak-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 16px;
    flex-shrink: 0;
  }
  .flame {
    font-size: 22px;
    animation: flicker 1.8s ease-in-out infinite alternate;
  }
  @keyframes flicker {
    0%   { transform: scaleY(1) rotate(-2deg); }
    50%  { transform: scaleY(1.08) rotate(1deg); }
    100% { transform: scaleY(0.95) rotate(-1deg); }
  }
  .streak-count {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.04em;
    color: var(--fire);
    line-height: 1;
  }
  .streak-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
  }

  /* ── Stats Row ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    padding: 14px 16px;
    text-align: center;
    border-right: 1px solid var(--border);
  }
  .stat:last-child { border-right: none; }
  .stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.05em;
    line-height: 1;
  }
  .stat-value.done  { color: var(--green); }
  .stat-value.miss  { color: var(--muted); }
  .stat-value.pct   { color: var(--gold); }
  .stat-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* ── Grid ── */
  .grid-wrap { padding: 20px 20px 8px; }
  .month-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 7px;
  }

  .day-cell {
    aspect-ratio: 1;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.15s;
    position: relative;
    border: 1.5px solid transparent;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .day-cell:active { transform: scale(0.88); }

  .day-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    line-height: 1;
  }

  /* States */
  .day-cell.empty {
    background: var(--card);
    border-color: var(--border);
  }
  .day-cell.empty .day-num { color: var(--muted); }
  .day-cell.empty:hover { border-color: #3a3a48; transform: scale(1.05); }

  .day-cell.done {
    background: linear-gradient(135deg, #1a3a2a 0%, #122a1e 100%);
    border-color: var(--green);
    box-shadow: 0 0 12px rgba(57, 217, 138, 0.2);
  }
  .day-cell.done .day-num { color: var(--green); }
  .day-cell.done:hover { transform: scale(1.06); box-shadow: 0 0 18px rgba(57, 217, 138, 0.35); }

  .day-cell.streak-active {
    background: linear-gradient(135deg, #2a1800 0%, #1e0f00 100%);
    border-color: var(--fire);
    box-shadow: 0 0 14px var(--fire-glow);
  }
  .day-cell.streak-active .day-num { color: var(--fire); }
  .day-cell.streak-active:hover { transform: scale(1.06); box-shadow: 0 0 20px rgba(255,92,0,0.45); }

  .day-cell.today {
    border-color: var(--gold) !important;
    box-shadow: 0 0 14px rgba(245, 200, 66, 0.25) !important;
  }

  .day-cell.missed {
    background: var(--card);
    border-color: #3a2a2a;
    opacity: 0.55;
  }
  .day-cell.missed .day-num { color: #5a3a3a; }

  .day-cell.future {
    background: transparent;
    border-color: #22222a;
    opacity: 0.4;
    cursor: default;
  }
  .day-cell.future .day-num { color: var(--muted); }

  .tick {
    font-size: 9px;
    margin-top: 1px;
    line-height: 1;
  }
  .day-cell.done .tick      { color: var(--green); content: '✓'; }
  .day-cell.streak-active .tick { color: var(--fire); }

  /* Today dot */
  .today-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--gold);
    position: absolute;
    bottom: 4px;
  }

  /* ── Bottom bar ── */
  .bottom {
    padding: 14px 20px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .ld-done   { background: var(--green); }
  .ld-streak { background: var(--fire); }
  .ld-miss   { background: #3a2a2a; }

  .reset-btn {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .reset-btn:hover { color: var(--fire); border-color: var(--fire); }

  /* ── Progress bar ── */
  .progress-wrap {
    padding: 0 20px 16px;
  }
  .progress-track {
    background: var(--card);
    border-radius: 99px;
    height: 4px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--fire) 0%, var(--gold) 100%);
    transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 8px var(--fire-glow);
  }

  /* Pulse on toggle */
  @keyframes pulse-green {
    0%   { box-shadow: 0 0 0 0 rgba(57,217,138,0.5); }
    70%  { box-shadow: 0 0 0 8px rgba(57,217,138,0); }
    100% { box-shadow: 0 0 0 0 rgba(57,217,138,0); }
  }
  @keyframes pulse-fire {
    0%   { box-shadow: 0 0 0 0 rgba(255,92,0,0.5); }
    70%  { box-shadow: 0 0 0 8px rgba(255,92,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,92,0,0); }
  }
  .pop-green { animation: pulse-green 0.45s ease-out; }
  .pop-fire  { animation: pulse-fire 0.45s ease-out; }
</style>
</head>
<body>

<div class="widget">
  <!-- Header -->
  <div class="header">
    <div class="title-block">
      <div class="label">Challenge</div>
      <div class="title">30<span>-DAY</span> GRIND</div>
    </div>
    <div class="streak-badge">
      <div class="flame">🔥</div>
      <div>
        <div class="streak-count" id="streakNum">0</div>
        <div class="streak-label">Streak</div>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat-value done" id="statDone">0</div>
      <div class="stat-label">Done</div>
    </div>
    <div class="stat">
      <div class="stat-value miss" id="statMiss">0</div>
      <div class="stat-label">Missed</div>
    </div>
    <div class="stat">
      <div class="stat-value pct" id="statPct">0%</div>
      <div class="stat-label">Rate</div>
    </div>
  </div>

  <!-- Grid -->
  <div class="grid-wrap">
    <div class="month-label" id="monthLabel">June 2026 · Tap a day to log</div>
    <div class="day-grid" id="dayGrid"></div>
  </div>

  <!-- Progress bar -->
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <!-- Bottom -->
  <div class="bottom">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot ld-done"></div>Done</div>
      <div class="legend-item"><div class="legend-dot ld-streak"></div>Streak</div>
      <div class="legend-item"><div class="legend-dot ld-miss"></div>Missed</div>
    </div>
    <button class="reset-btn" onclick="resetAll()">Reset</button>
  </div>
</div>

<script>
  const STORAGE_KEY = 'workout30_v1';
  const TOTAL = 30;

  // Determine start date: today minus (today's day-of-month minus 1) = first of current month
  // Actually: start = June 1, 2026 (fixed for this widget; can adjust)
  const now = new Date();
  const startDate = new Date(now.getFullYear(), now.getMonth(), 1); // 1st of current month
  const todayIndex = Math.floor((now - startDate) / 86400000); // 0-based index

  let data = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : Array(TOTAL).fill(null);
    } catch { return Array(TOTAL).fill(null); }
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
  }

  function resetAll() {
    if (!confirm('Reset all progress?')) return;
    data = Array(TOTAL).fill(null);
    save(); render();
  }

  function toggle(i) {
    if (i > todayIndex) return; // can't log future
    if (data[i] === 'done') {
      data[i] = null;
    } else {
      data[i] = 'done';
    }
    save(); render();
  }

  function calcStreak() {
    // Current streak: consecutive done days ending at (or before) today
    let streak = 0;
    for (let i = Math.min(todayIndex, TOTAL - 1); i >= 0; i--) {
      if (data[i] === 'done') streak++;
      else break;
    }
    return streak;
  }

  function render() {
    const grid = document.getElementById('dayGrid');
    grid.innerHTML = '';

    const streak = calcStreak();
    let done = 0, missed = 0;

    // Figure out which days are in the active streak tail
    const streakStart = streak > 0 ? Math.min(todayIndex, TOTAL - 1) - streak + 1 : -1;

    for (let i = 0; i < TOTAL; i++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';

      const dayNum = document.createElement('div');
      dayNum.className = 'day-num';
      dayNum.textContent = String(i + 1).padStart(2, '0');

      const tick = document.createElement('div');
      tick.className = 'tick';

      if (i > todayIndex) {
        // Future
        cell.classList.add('future');
        tick.textContent = '';
      } else if (data[i] === 'done') {
        done++;
        if (i >= streakStart && streak > 0) {
          cell.classList.add('streak-active');
          tick.textContent = '🔥';
        } else {
          cell.classList.add('done');
          tick.textContent = '✓';
        }
        cell.addEventListener('click', () => {
          cell.classList.add(i >= streakStart ? 'pop-fire' : 'pop-green');
          setTimeout(() => cell.classList.remove('pop-fire','pop-green'), 450);
          toggle(i);
        });
      } else {
        // Past, not done = missed
        missed++;
        cell.classList.add('missed');
        tick.textContent = '✕';
        cell.addEventListener('click', () => toggle(i));
      }

      if (i === todayIndex && i < TOTAL) {
        cell.classList.add('today');
        const dot = document.createElement('div');
        dot.className = 'today-dot';
        cell.appendChild(dot);
        if (data[i] !== 'done') {
          cell.classList.remove('missed');
          cell.classList.add('empty');
          tick.textContent = '';
          missed--; // today not yet missed
          cell.addEventListener('click', () => toggle(i));
        }
      }

      // Empty (today, not yet logged)
      if (i === todayIndex && data[i] !== 'done') {
        cell.classList.remove('missed');
        cell.classList.add('empty');
        tick.textContent = '';
        if (cell.getAttribute('data-listener') !== '1') {
          cell.setAttribute('data-listener','1');
          cell.addEventListener('click', () => toggle(i));
        }
      }

      cell.appendChild(dayNum);
      cell.appendChild(tick);
      grid.appendChild(cell);
    }

    // Update stats
    document.getElementById('streakNum').textContent = streak;
    document.getElementById('statDone').textContent = done;
    document.getElementById('statMiss').textContent = missed;
    const pastDays = todayIndex + 1;
    const pct = pastDays > 0 ? Math.round((done / pastDays) * 100) : 0;
    document.getElementById('statPct').textContent = pct + '%';
    document.getElementById('progressFill').style.width = ((done / TOTAL) * 100) + '%';

    // Month label
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('monthLabel').textContent =
      `${months[startDate.getMonth()]} ${startDate.getFullYear()} · Tap a day to log`;
  }

  render();
</script>
</body>
</html>
